name: Clean repository and deploy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-deploy.yml

permissions:
  contents: write

jobs:
  clean-build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Remove committed build artifacts
        run: rm -rf .next node_modules
      - name: Add clean project configuration
        run: |
          cat > .gitignore <<'EOF'
          node_modules/
          .next/
          out/
          .vercel/
          *.log
          .env*
          !.env.example
          .DS_Store
          EOF
          cat > vercel.json <<'EOF'
          {
            "framework": "nextjs",
            "installCommand": "npm ci",
            "buildCommand": "npm run build"
          }
          EOF
      - name: Install dependencies
        run: npm ci
      - name: Test production build
        run: npm run build
      - name: Commit clean project
        run: |
          rm -rf .next node_modules
          rm -f .github/workflows/cleanup-deploy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: clean repository and restore Vercel deployment"
          git push origin HEAD:main
          git push --force origin HEAD:v3-web-app
