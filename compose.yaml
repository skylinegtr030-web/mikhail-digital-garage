name: mikhail-digital-garage

services:
  db:
    image: postgres:16-alpine
    container_name: mikhail-digital-garage-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./runtime/db:/var/lib/postgresql/data
    networks:
      - app_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-digital_garage} -d ${POSTGRES_DB:-digital_garage}"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: mikhail-digital-garage-web:latest
    container_name: mikhail-digital-garage-web
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    expose:
      - "3000"
    volumes:
      - ./runtime/uploads:/app/runtime/uploads
    networks:
      - web
      - app_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web:
    external: true
  app_internal:
    internal: true
